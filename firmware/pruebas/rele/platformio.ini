; Prueba de banco: localizar el GPIO del relé de la placa ESP32_Relay X1 V1.2
; (docs/MONTAJE.md §5.1). Solo en la mesa, sin la máquina conectada.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM5
monitor_port = COM5
upload_speed = 921600
; Sin EN conectado al programador: mantener IO0 al dar tensión antes de subir
; y quitar/dar tensión al terminar.
