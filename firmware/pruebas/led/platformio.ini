; Prueba de banco: parpadeo del LED de estado (GPIO2, docs/ESQUEMA_CONEXION.md).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Puerto detectado solo (COMx en Windows, /dev/ttyUSB0 o /dev/ttyACM0 en Linux).
; Para fijarlo: pio run -t upload --upload-port <puerto>
; Sin EN conectado al programador: mantener IO0 al dar tensión antes de subir
; y quitar/dar tensión al terminar.
