; Firmware V-ECU — control de rpm del D6D (docs/CONTROL_RPM.md)
; Placa ESP32_Relay X1 V1.2 programada por P4 con el programador USB-C.

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Puerto detectado solo (COMx en Windows, /dev/ttyUSB0 o /dev/ttyACM0 en Linux).
; Para fijarlo: pio run -t upload --upload-port <puerto>
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9
build_flags =
    -Wall

; Por defecto: CAN en solo escucha, TSC1 deshabilitado.
[env:esp32dev]

; Habilita la transmisión de TSC1 (vía A). Solo para la Fase 2 de
; docs/CONTROL_RPM.md, tras la captura del bus y con la máquina parada.
[env:esp32dev_tsc1]
build_flags =
    ${env.build_flags}
    -DVECU_TSC1_TX=1
